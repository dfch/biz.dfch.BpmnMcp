<!--
  The feat-29 prototype page (REQ-001, Task 100.100): the full bpmn-js
  Modeler (not the Viewer) on #canvas, the pinned dist assets over the
  /bpmn-js/ prefix (the feat-20 convention), the control strip
  (name input, Load/Save over the file API that lands in Phase 110),
  and the commandStack.changed event log (the observability strip for
  the later evaluation phases). The __bpmn bridge is loaded from
  /bridge.js (404 until Phase 120); this page exposes the Modeler
  instance as window.__modeler for it.

  The "powered by bpmn.io" watermark is rendered by the Modeler bundle
  itself (the accepted bpmn.io License clause, DEC
  fdc84432-1b48-4eb9-82e0-ec13cb8cf8ba) and is deliberately left
  unmodified: this page applies no CSS override to the powered-by
  element.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BPMN Modeler (feat-29 prototype)</title>
    <link rel="stylesheet" href="/bpmn-js/assets/diagram-js.css" />
    <link rel="stylesheet" href="/bpmn-js/assets/bpmn-js.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: Arial, sans-serif;
      }
      #controls {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        border-bottom: 1px solid #ccc;
        background: #f5f5f5;
      }
      #name {
        padding: 4px 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      #load,
      #save {
        padding: 4px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      #status {
        font-size: 13px;
        color: #900;
      }
      #canvas {
        flex: 1;
        min-height: 0;
        width: 100%;
      }
      #event-log {
        flex: none;
        height: 120px;
        margin: 0;
        padding: 8px 16px;
        border-top: 1px solid #ccc;
        background: #fafafa;
        font-size: 12px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <label for="name">Diagram name</label>
      <input id="name" type="text" value="diagram.bpmn" />
      <button id="load" type="button">Load</button>
      <button id="save" type="button">Save</button>
      <span id="status"></span>
    </div>
    <div id="canvas"></div>
    <pre id="event-log"></pre>
    <script src="/bpmn-js/bpmn-modeler.production.min.js"></script>
    <script src="/bridge.js"></script>
    <script>
      (function () {
        var canvas = document.getElementById('canvas');
        var nameInput = document.getElementById('name');
        var loadButton = document.getElementById('load');
        var saveButton = document.getElementById('save');
        var status = document.getElementById('status');
        var eventLog = document.getElementById('event-log');

        // The full Modeler (REQ-001): the unmodified "powered by
        // bpmn.io" watermark is rendered by the bundle itself.
        var modeler = new BpmnModeler({ container: canvas });
        // Exposed for web/bridge.js (Phase 120): the bridge is a thin
        // pass-through over this instance's API.
        window.__modeler = modeler;

        // Observability strip for the later evaluation phases: one
        // line per commandStack.changed event (timestamp + event type).
        modeler.on('commandStack.changed', function () {
          eventLog.textContent += new Date().toISOString() + ' commandStack.changed\n';
        });

        function showStatus(message) {
          status.textContent = message;
        }

        function diagramName() {
          return nameInput.value.trim();
        }

        // The file API lands in Phase 110; until then these calls 404
        // and the status area surfaces the failure.
        loadButton.addEventListener('click', function () {
          var name = diagramName();
          if (!name) {
            showStatus('enter a diagram name first');
            return;
          }
          fetch('/file?name=' + encodeURIComponent(name))
            .then(function (response) {
              if (!response.ok) {
                throw new Error('load failed (HTTP ' + response.status + ')');
              }
              return response.text();
            })
            .then(function (xml) {
              return modeler.importXML(xml).then(function () {
                modeler.get('canvas').zoom('fit-viewport');
                showStatus('loaded ' + name);
              });
            })
            .catch(function (error) {
              showStatus(error && error.message ? error.message : String(error));
            });
        });

        saveButton.addEventListener('click', function () {
          var name = diagramName();
          if (!name) {
            showStatus('enter a diagram name first');
            return;
          }
          modeler
            .saveXml()
            .then(function (result) {
              return fetch('/file?name=' + encodeURIComponent(name), {
                method: 'POST',
                headers: { 'content-type': 'application/xml' },
                body: result.xml,
              });
            })
            .then(function (response) {
              if (!response.ok) {
                throw new Error('save failed (HTTP ' + response.status + ')');
              }
              showStatus('saved ' + name);
            })
            .catch(function (error) {
              showStatus(error && error.message ? error.message : String(error));
            });
        });
      })();
    </script>
  </body>
</html>
