name: Lint and Test

# Mirrors the biz.dfch.SpecMgr ci.yml family pattern, adapted to this
# repository's TypeScript/Node stack (QA 0.0180): a single build-gate
# job - nothing is published or deployed (QA 0.0080). The commands run
# from the repository root, where the private workspaces manifest
# delegates them to the components (QA 0.0270). The sister's
# "Make sure X is correct" drift-gate steps have no counterpart yet,
# because this repository has no generated artifacts; they join this
# workflow when it does.

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    env:
      # Opt-in to Node 24 to avoid Node 20 deprecation warnings (effective June 2026).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # uses: actions/checkout@v7 (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        # uses: actions/setup-node@v7 (v7.1.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        # `npm ci` at the root - the strict, lockfile-based install of all
        # workspaces (QA 0.0180/0.0270); requires the committed
        # package-lock.json (QA 0.0080).
        run: npm ci

      - name: Audit production dependencies (low)
        # Production code ships to users: any advisory of severity low
        # or higher on a production dependency fails CI (feat-33
        # REQ-003). npm's `info` level is ignored on purpose. A registry
        # outage fails this step; re-run the job, never skip the step.
        run: npm audit --omit=dev --audit-level=low

      - name: Audit all dependencies (high)
        # Dev tooling runs only on developer and CI machines with
        # repo-controlled inputs: only high and critical advisories
        # anywhere in the tree fail CI (feat-33 REQ-004). Moderate and
        # low dev-only advisories go through Dependabot alerts and the
        # SECURITY.md policy (e.g. the archunit -> minimatch residual,
        # DEC af53edf7).
        run: npm audit --audit-level=high

      - name: Lint
        # ESLint - naming, line width, complexity (QA 0.0220/0.0280).
        run: npm run lint

      - name: Format check
        # Prettier --check - K&R braces, quotes, semicolons, trailing
        # commas (QA 0.0280).
        run: npm run format:check

      - name: Build (type-check gate)
        run: npm run build

      - name: Run tests with coverage
        # @vitest/coverage-v8 (QA 0.0260); report-only in the first draft.
        run: npm test -- --coverage
