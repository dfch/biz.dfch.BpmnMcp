# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm' # See documentation for possible values
    directory: '/' # Location of package manifests
    schedule:
      interval: 'weekly'
    # typescript-eslint caps TypeScript at < 6.1.0, so a TypeScript major
    # bump (e.g. 7.x) fails `npm ci` with a peer-dependency conflict. Hold
    # majors until typescript-eslint lifts the cap (DEC 5185d651, feat-12).
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    # Group routine minor and patch version updates into one PR per
    # ecosystem. `applies-to: version-updates` keeps security updates out of
    # the group, so each advisory still gets its own PR (feat-33, REQ-006).
    groups:
      minor-and-patch:
        applies-to: 'version-updates'
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Group routine minor and patch version updates into one PR per
    # ecosystem. `applies-to: version-updates` keeps security updates out of
    # the group, so each advisory still gets its own PR (feat-33, REQ-006).
    groups:
      minor-and-patch:
        applies-to: 'version-updates'
        patterns: ['*']
        update-types: ['minor', 'patch']
